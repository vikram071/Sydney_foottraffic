<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sydney Transport Intelligence & Live Foot Traffic Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(17, 24, 39, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #06B6D4;
        }
        .status-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border: 1px solid #10B981;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 65px);
            border: none;
            background-color: #0B0F19;
        }
        .fallback-container {
            padding: 40px 20px;
            text-align: center;
            max-width: 650px;
            margin: 40px auto;
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #06B6D4, #3B82F6);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 16px;
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <span>🚆</span>
            <span>Sydney Transport Intelligence Platform</span>
        </div>
        <div class="status-badge">● 30-MIN LIVE INGESTION ACTIVE</div>
    </header>
    <main id="app-container">
        <!-- Embedded Streamlit Application -->
        <iframe 
            src="https://share.streamlit.io/" 
            title="Sydney Transport Intelligence Streamlit Dashboard"
            id="streamlitFrame"
            allow="geolocation">
        </iframe>
    </main>
    <script>
        // Check if custom Streamlit deployment URL is available in query param or fallback
        const urlParams = new URLSearchParams(window.location.search);
        const appUrl = urlParams.get('app') || 'https://share.streamlit.io/';
        if (appUrl !== 'https://share.streamlit.io/') {
            document.getElementById('streamlitFrame').src = appUrl;
        }
    </script>
</body>
</html>
